<!DOCTYPE html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Clickly — Reset password</title>
        <link rel="icon" href="http://localhost/favicon.ico">
        
        <meta property="og:title" content="Clickly - Link shortening service">
        <meta property="og:description" content="Clickly - modern link shortening service">
        
        <meta property="og:url" content="http://localhost/">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Clickly">

        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    </head>
    <body class="bg-gradient-to-tr from-zinc-900 via-zinc-950 to-zinc-800 min-h-screen text-zinc-100 flex flex-col">
        <header class="sticky top-0 z-50 bg-zinc-900/95 backdrop-blur-md border-b border-zinc-800/50">
            <div class="max-w-7xl mx-auto flex items-center px-8 py-4" style="padding-top: 20px; padding-bottom: 20px; margin-left: 21.5px;">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="bg-indigo-600 rounded-xl w-10 h-10 flex items-center justify-center shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                        </svg>
                    </div>
                    <span class="text-2xl font-bold text-indigo-300">Clickly</span>
                    <div class="hidden lg:block px-4 py-1 mt-1 bg-indigo-500/20 rounded-lg">
                        <span class="text-xs text-indigo-300 font-semibold">BETA</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 flex items-center justify-center px-4 py-12 fade-in">
            <div class="w-full max-w-md bg-zinc-900/90 rounded-2xl shadow-2xl border border-zinc-800 p-8 flex flex-col items-center">
                <div class="w-16 h-16 bg-indigo-500/20 rounded-2xl flex items-center justify-center mb-6">
                    <svg class="w-10 h-10 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"></rect>
                        <circle cx="12" cy="16" r="1" stroke-width="2"></circle>
                        <path d="m7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-indigo-300 mb-2">Reset password</h2>
                <p class="text-zinc-400 text-center text-sm mb-6">Create a new password to log into your account</p>
                <form id="reset-password-form" class="w-full flex flex-col gap-5">
                    <div class="relative">
                        <label class="text-sm text-zinc-400 mb-2 block">New password</label>
                        <div class="relative">
                            <input type="password" id="new-password" required minlength="8" class="w-full rounded-xl p-4 bg-zinc-800 text-white placeholder-zinc-400 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all pr-12 text-lg" placeholder="Enter new password">
                            <button type="button" onclick="togglePassword(this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-indigo-300 transition-colors p-1 rounded hover:bg-zinc-700/50 flex items-center justify-center" tabindex="-1" style="top: 50%; transform: translateY(-50%);">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"></rect>
                                    <circle cx="12" cy="16" r="1" stroke-width="2"></circle>
                                    <path d="m7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="relative">
                        <label class="text-sm text-zinc-400 mb-2 block">Confirm new password</label>
                        <div class="relative">
                            <input type="password" id="confirm-password" required minlength="8" class="w-full rounded-xl p-4 bg-zinc-800 text-white placeholder-zinc-400 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all pr-12 text-lg" placeholder="Confirm new password">
                            <button type="button" onclick="togglePassword(this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-indigo-300 transition-colors p-1 rounded hover:bg-zinc-700/50 flex items-center justify-center" tabindex="-1" style="top: 50%; transform: translateY(-50%);">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"></rect>
                                    <circle cx="12" cy="16" r="1" stroke-width="2"></circle>
                                    <path d="m7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition-colors">Update password</button>
                </form>
            </div>
        </main>
        </main>

        <script src="script.js"></script>
        <script src="password-reset.js"></script>
    </body>
</html>
